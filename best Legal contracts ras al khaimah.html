<script>
(function(){
  const bgCanvas=document.getElementById('bg-canvas'),bgCtx=bgCanvas.getContext('2d');
  let bW,bH;
  function bgResize(){bW=bgCanvas.width=window.innerWidth;bH=bgCanvas.height=window.innerHeight;}
  bgResize();window.addEventListener('resize',bgResize);
  const orbs=Array.from({length:8},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:180+Math.random()*200,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,alpha:.03+Math.random()*.04,phase:Math.random()*Math.PI*2}));
  const GRID=55;let tick2=0;
  function drawBg(){
    bgCtx.clearRect(0,0,bW,bH);tick2+=.008;
    const scrollY=window.scrollY*.2;
    bgCtx.lineWidth=1;
    for(let x=0;x<bW;x+=GRID){const a=0.06+0.04*Math.sin(tick2+x*.01);bgCtx.strokeStyle=`rgba(0,212,200,${a})`;bgCtx.beginPath();bgCtx.moveTo(x,0);bgCtx.lineTo(x,bH);bgCtx.stroke();}
    for(let y=-GRID;y<bH+GRID;y+=GRID){const w=Math.sin(tick2*1.5+y*.015)*14,a=0.05+0.03*Math.sin(tick2+y*.02);bgCtx.strokeStyle=`rgba(0,212,200,${a})`;bgCtx.beginPath();bgCtx.moveTo(0,y+(scrollY%GRID)+w);bgCtx.lineTo(bW,y+(scrollY%GRID)-w);bgCtx.stroke();}
    orbs.forEach(o=>{
      o.x+=o.vx;o.y+=o.vy;o.phase+=.012;
      if(o.x<-o.r)o.x=bW+o.r;if(o.x>bW+o.r)o.x=-o.r;if(o.y<-o.r)o.y=bH+o.r;if(o.y>bH+o.r)o.y=-o.r;
      const p=o.alpha*(.5+.5*Math.sin(o.phase)),g=bgCtx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`rgba(0,212,200,${p*2.5})`);g.addColorStop(.4,`rgba(0,212,200,${p*1.2})`);g.addColorStop(1,'rgba(0,212,200,0)');
      bgCtx.beginPath();bgCtx.arc(o.x,o.y,o.r,0,Math.PI*2);bgCtx.fillStyle=g;bgCtx.fill();
    });
    [0,.5].forEach(off=>{
      const sx=((tick2*100+off*(bW+bH))%(bW+bH));
      bgCtx.beginPath();bgCtx.moveTo(sx-bH,0);bgCtx.lineTo(sx,bH);
      const sg=bgCtx.createLinearGradient(sx-bH,0,sx,bH);
      sg.addColorStop(0,'rgba(0,212,200,0)');sg.addColorStop(.5,'rgba(0,212,200,0.10)');sg.addColorStop(1,'rgba(0,212,200,0)');
      bgCtx.strokeStyle=sg;bgCtx.lineWidth=2.5;bgCtx.stroke();
    });
    [[0,0],[bW,0],[0,bH],[bW,bH]].forEach(([cx,cy],i)=>{
      const r=(tick2*60+i*80)%300,a=Math.max(0,.12*(1-r/300));
      bgCtx.beginPath();bgCtx.arc(cx,cy,r,0,Math.PI*2);bgCtx.strokeStyle=`rgba(0,212,200,${a})`;bgCtx.lineWidth=1.5;bgCtx.stroke();
    });
    requestAnimationFrame(drawBg);
  }
  drawBg();
})();
const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}})},{threshold:.12});
document.querySelectorAll('.reveal,.reveal-scale').forEach(el=>io.observe(el));
(function(){
  var cio=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting&&!e.target.dataset.done){
        e.target.dataset.done='1';
        var target=parseInt(e.target.dataset.target),suffix=e.target.dataset.suffix||'',dur=1800,start=performance.now();
        (function tick(now){var p=Math.min((now-start)/dur,1),ease=1-Math.pow(1-p,3);e.target.textContent=Math.floor(ease*target)+suffix;if(p<1)requestAnimationFrame(tick);else e.target.textContent=target+suffix;})(performance.now());
      }
    });
  },{threshold:0.1});
  document.querySelectorAll('.stat-val[data-target]').forEach(function(el){cio.observe(el);});
})();
document.querySelectorAll('.faq-q').forEach(function(btn){
  btn.addEventListener('click',function(){
    var item=this.parentElement,wasOpen=item.classList.contains('open');
    document.querySelectorAll('.faq-item-box').forEach(function(i){i.classList.remove('open');});
    if(!wasOpen) item.classList.add('open');
  });
});
window.addEventListener('mousemove',e=>{const g=document.querySelector('.hero-glow');if(!g)return;const x=(e.clientX/window.innerWidth-.5)*30,y=(e.clientY/window.innerHeight-.5)*30;g.style.transform=`translate(${x}px,${y}px)`;});
</script>
